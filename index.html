<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room - Mainboard</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        canvas {
            width: 100vw;
            height: 100vh;
            display: none;
        }
        .title, .timer, .question-box {
            position: absolute;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            display: none;
        }
        .title { top: 20px; left: 50%; transform: translateX(-50%); }
        .timer { top: 20px; right: 20px; background: rgba(255, 0, 0, 0.7); }
        .question-box {
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
        }
        .question-box button {
            display: block;
            margin: 10px auto;
            padding: 10px;
            font-size: 16px;
            width: 100%;
        }
        .start-screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
            color: white;
            font-size: 24px;
            flex-direction: column;
        }
        .start-screen button { font-size: 20px; padding: 10px 20px; cursor: pointer; margin-top: 20px; }
        .game-over {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: red;
            color: white;
            padding: 20px;
            border-radius: 10px;
            font-size: 24px;
            display: none;
        }
        .victory {
            background: green;
            color: white;
        }
    </style>
</head>
<body>
    <div class="start-screen" id="startScreen">
        <h1>Escape Room Tecnológico</h1>
        <p>Presiona el botón para comenzar</p>
        <button onclick="startGame()">Empezar el Juego</button>
    </div>
    <div class="title" id="title">Escape Room Tecnológico: Repara la Mainboard</div>
    <div class="timer" id="timer">08:00</div>
    <canvas id="renderCanvas"></canvas>
    <div class="question-box" id="questionBox"></div>
    <div class="game-over" id="gameOver"></div>
    
    <script>
        const questionsDB = {
            "Socket del CPU": [
                { question: "¿Dónde se instala el procesador?", answers: ["Socket del CPU", "Ranura RAM", "Chipset"], correct: 0 },
                { question: "¿Qué socket usa AMD Ryzen?", answers: ["LGA", "PGA", "AM4"], correct: 2 }
            ],
            "Ranuras RAM": [
                { question: "¿Qué se instala en las ranuras RAM?", answers: ["Memoria RAM", "Disco SSD", "Fuente de poder"], correct: 0 },
                { question: "¿Cuál es el formato más común de RAM?", answers: ["DDR4", "SDRAM", "GDDR6"], correct: 0 }
            ]
        };

        let timeLeft = 8 * 60;
        let activeQuestions = [];
        let answeredComponents = 0;
        let timerRunning = false;
        let gameOver = false;

        function startGame() {
            document.getElementById("startScreen").style.display = "none";
            setTimeout(() => {
                document.getElementById("title").style.display = "block";
                document.getElementById("timer").style.display = "block";
                document.getElementById("renderCanvas").style.display = "block";
                timerRunning = true;
                updateTimer();
                initGame();
            }, 5000);
        }

        function updateTimer() {
            if (!timerRunning) return;
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            document.getElementById("timer").textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            if (timeLeft > 0) {
                timeLeft--;
                setTimeout(updateTimer, 1000);
            } else {
                endGame(true);
            }
        }

        function endGame(lost) {
            timerRunning = false;
            gameOver = true;
            const messageBox = document.getElementById("gameOver");
            messageBox.style.display = "block";
            messageBox.innerText = lost ? "¡La mainboard ha sido infectada por el virus!" : "¡Has derrotado al virus y salvado la mainboard!";
            if (!lost) messageBox.classList.add("victory");
            setTimeout(() => { location.reload(); }, 3000);
        }

        function showQuestions() {
            if (gameOver || activeQuestions.length === 0) return;
            let component = activeQuestions.shift();
            askQuestion(component[0], [...component[1]]);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function askQuestion(component, questions) {
            if (gameOver) return;
            const box = document.getElementById("questionBox");
            box.innerHTML = `<h3>${component}</h3>`;
            const question = questions.shift();
            shuffleArray(question.answers);
            box.innerHTML += `<p>${question.question}</p>`;
            question.answers.forEach((answer, index) => {
                const button = document.createElement("button");
                button.textContent = answer;
                button.onclick = () => {
                    if (index === question.correct) {
                        if (questions.length > 0) {
                            askQuestion(component, questions);
                        } else {
                            answeredComponents++;
                            if (answeredComponents === 3) {
                                timeLeft = 0; // DETIENE EL TIEMPO INMEDIATAMENTE
                                endGame(false); // Muestra el mensaje de victoria
                            } else {
                                box.style.display = "none";
                                setTimeout(() => showQuestions(), 500);
                            }
                        }
                    } else {
                        timeLeft -= 40;
                    }
                };
                box.appendChild(button);
            });
            box.style.display = "block";
        }

        function initGame() {
            const canvas = document.getElementById("renderCanvas");
            const engine = new BABYLON.Engine(canvas, true);
            const scene = new BABYLON.Scene(engine);
            const camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 2, Math.PI / 2, 1.5, new BABYLON.Vector3(0, 0, 0), scene);
            camera.attachControl(canvas, true);
            camera.inertia = 0;
            BABYLON.SceneLoader.ImportMesh("", "models/", "mainboard.glb", scene, () => {
                activeQuestions = Object.entries(questionsDB).sort(() => 0.5 - Math.random()).slice(0, 3);
                setTimeout(() => showQuestions(), 1000);
            });
            engine.runRenderLoop(() => scene.render());
        }
    </script>
</body>
</html>
